version: "3.7"

services:
  gateway:
    # image: nginx:alpine
    image: openmrs/openmrs-reference-application-3-gateway:${TAG:-qa}
    restart: "unless-stopped"
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    networks:
      - ssemr-network
    
  frontend:
    image: openmrs/openmrs-reference-application-3-frontend:${TAG:-qa}
    restart: "unless-stopped"
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_CONFIG_URLS: "/openmrs/spa/config.json"
      SPA_DEFAULT_LOCALE:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 5s
    depends_on:
      - backend
    networks:
      - ssemr-network

  backend:
    image: openmrs/openmrs-reference-application-3-backend:${TAG:-qa}
    restart: "unless-stopped"
    depends_on:
      db:
        condition: service_started
      db-setup:
        condition: service_completed_successfully
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OPENMRS_DB_USER:-openmrs}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OPENMRS_DB_PASSWORD:-openmrs}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs"]
      timeout: 5s
    volumes:
      - openmrs-data:/openmrs/data
    networks:
      - ssemr-network

  # MariaDB
  db:
    image: mariadb:10.8.2
    restart: "unless-stopped"
    # optimizer-search-depth=0 lets the optimizer pick its own (greedy) search depth.
    # The default of 62 makes it enumerate join orders exhaustively, which never
    # terminates on the 36-table join Hibernate emits for a queue-entry search.
    # event-scheduler=ON runs the scheduled MAMBA ETL; without it the analysis tables never refresh.
    command: "mysqld --character-set-server=utf8 --collation-server=utf8_general_ci --optimizer-search-depth=0 --event-scheduler=ON"
    healthcheck:
      test: "mysql --user=${OMRS_DB_USER:-openmrs} --password=${OMRS_DB_PASSWORD:-openmrs} --execute \"SHOW DATABASES;\""
      interval: 3s
      timeout: 1s
      retries: 5
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - ssemr-network

  # One-shot: creates the MAMBA ETL database and grants the OpenMRS user access to it, so no one
  # has to do this by hand on each server. Runs on every "up"; every step is safe to repeat.
  db-setup:
    image: mariadb:10.8.2
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["bash", "/etl-database-setup.sh"]
    environment:
      DB_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
      OPENMRS_DB_USER: ${OPENMRS_DB_USER:-openmrs}
      ETL_DATABASE: ${ETL_DATABASE:-ssemr_etl}
    volumes:
      - ./db/etl-database-setup.sh:/etl-database-setup.sh:ro
    networks:
      - ssemr-network

  # Scheduled database backups, configured from System Administration > Backups. Keeps copies in
  # BACKUP_HOST_DIR (default ./backups) and sends them to the receiving server over SSH.
  backup:
    build:
      context: ./backup
    restart: "unless-stopped"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
      OPENMRS_DB_USER: ${OPENMRS_DB_USER:-openmrs}
      # Only read once, to carry settings from older .env files into the database.
      FACILITY_NAME: ${FACILITY_NAME:-}
      REMOTE_HOST: ${REMOTE_HOST:-}
      REMOTE_USER: ${REMOTE_USER:-}
      REMOTE_DIR: ${REMOTE_DIR:-}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - backup-ssh:/ssh
    networks:
      - ssemr-network

volumes:
  openmrs-data: ~
  db-data: ~
  backup-ssh: ~

networks:
  ssemr-network:
    driver: bridge