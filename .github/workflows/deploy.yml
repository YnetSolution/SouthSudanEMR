name: Deploy Distro to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: 'Service(s) to rebuild & deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'backend'
          - 'frontend'
          - 'gateway'
          - 'backend frontend'
      no_cache:
        description: 'Build without Docker cache (--no-cache)'
        required: true
        type: boolean
        default: false

jobs:
  deploy:
    name: Detect Changes & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed files
        if: github.event_name == 'push'
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'distro/**'
              - 'pom.xml'
              - 'Dockerfile'
              - 'runtime-properties-config'
              - 'update_scheduler.sql'
            frontend:
              - 'frontend/**'
            gateway:
              - 'gateway/**'
              - 'nginx/**'
              - 'docker-compose*.yml'

      - name: Log Detected Changed Files
        if: github.event_name == 'push'
        run: |
          echo "=== Changed Files Detection Summary ==="
          echo "Backend Changed:  ${{ steps.changes.outputs.backend }}"
          echo "Frontend Changed: ${{ steps.changes.outputs.frontend }}"
          echo "Gateway Changed:  ${{ steps.changes.outputs.gateway }}"

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          request_pty: false
          script: |
            set -e
            cd ${{ secrets.SERVER_PROJECT_PATH }}
            export BUILDKIT_PROGRESS=plain
            export DOCKER_CLI_HINTS=false

            echo "::group::Git Pull Latest Code"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git pull --quiet origin main
            echo "::endgroup::"

            SERVICES=""
            BUILD_ARGS=""

            if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              SELECTED_SERVICE="${{ github.event.inputs.service }}"
              NO_CACHE="${{ github.event.inputs.no_cache }}"
              if [ "$NO_CACHE" == "true" ]; then
                BUILD_ARGS="--no-cache"
              fi
              if [ "$SELECTED_SERVICE" != "all" ]; then
                SERVICES="$SELECTED_SERVICE"
              else
                SERVICES="backend frontend gateway"
              fi
            else
              if [ "${{ steps.changes.outputs.backend }}" == "true" ]; then
                SERVICES="$SERVICES backend"
              fi
              if [ "${{ steps.changes.outputs.frontend }}" == "true" ]; then
                SERVICES="$SERVICES frontend"
              fi
              if [ "${{ steps.changes.outputs.gateway }}" == "true" ]; then
                SERVICES="$SERVICES gateway"
              fi
              if [ -z "$SERVICES" ]; then
                SERVICES="backend frontend gateway"
              fi
            fi

            echo "=================================================="
            echo " Target Services to Build & Deploy: $SERVICES"
            echo "=================================================="

            for SERVICE in $SERVICES; do
              echo "::group::Building Docker Image: [$SERVICE]"
              echo "--> Starting docker compose build for $SERVICE..."
              docker compose build --progress=plain $BUILD_ARGS $SERVICE
              echo "--> Successfully built $SERVICE"
              echo "::endgroup::"
            done

            echo "::group::Starting Docker Containers ($SERVICES)"
            docker compose up -d $SERVICES
            docker compose ps
            echo "::endgroup::"

            echo "::group::Pruning Docker Build Cache & Volumes"
            docker system prune -af --volumes > /dev/null 2>&1 || true
            echo "::endgroup::"

            echo "=================================================="
            echo "   DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "=================================================="
