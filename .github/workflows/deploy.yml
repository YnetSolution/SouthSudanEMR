name: Deploy Distro to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Detect Changes & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'distro/**'
              - 'pom.xml'
              - 'Dockerfile'
              - 'runtime-properties-config'
              - 'update_scheduler.sql'
            frontend:
              - 'frontend/**'
            gateway:
              - 'gateway/**'
              - 'nginx/**'
              - 'docker-compose*.yml'

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.SERVER_PROJECT_PATH }}

            echo "=== Pulling latest changes from main branch ==="
            git pull origin main

            SERVICES=""

            if [ "${{ steps.changes.outputs.backend }}" == "true" ]; then
              echo "-> Backend changes detected."
              SERVICES="$SERVICES backend"
            fi

            if [ "${{ steps.changes.outputs.frontend }}" == "true" ]; then
              echo "-> Frontend changes detected."
              SERVICES="$SERVICES frontend"
            fi

            if [ "${{ steps.changes.outputs.gateway }}" == "true" ]; then
              echo "-> Gateway / Config changes detected."
              SERVICES="$SERVICES gateway"
            fi

            if [ -z "$SERVICES" ]; then
              echo "-> General changes detected. Rebuilding all services..."
              docker compose up -d --build
            else
              echo "-> Rebuilding and restarting affected services:$SERVICES"
              docker compose build $SERVICES
              docker compose up -d $SERVICES
            fi

            echo "=== Pruning unused Docker images ==="
            docker image prune -f

            echo "=== Deployment Completed Successfully ==="
