name: Deploy Distro to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: 'Service(s) to rebuild & deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'backend'
          - 'frontend'
          - 'gateway'
          - 'backend frontend'
      no_cache:
        description: 'Build without Docker cache (--no-cache)'
        required: true
        type: boolean
        default: false

jobs:
  deploy:
    name: Detect Changes & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed files
        if: github.event_name == 'push'
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'distro/**'
              - 'pom.xml'
              - 'Dockerfile'
              - 'runtime-properties-config'
              - 'update_scheduler.sql'
            frontend:
              - 'frontend/**'
            gateway:
              - 'gateway/**'
              - 'nginx/**'
              - 'docker-compose*.yml'

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.SERVER_PROJECT_PATH }}

            echo "=== Pulling latest changes from main branch ==="
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git pull origin main

            SERVICES=""
            BUILD_ARGS=""

            if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              echo "=== Manual Trigger Received ==="
              SELECTED_SERVICE="${{ github.event.inputs.service }}"
              NO_CACHE="${{ github.event.inputs.no_cache }}"

              if [ "$NO_CACHE" == "true" ]; then
                echo "-> Building WITHOUT Docker cache (--no-cache)"
                BUILD_ARGS="--no-cache"
              fi

              if [ "$SELECTED_SERVICE" != "all" ]; then
                SERVICES="$SELECTED_SERVICE"
              fi
            else
              echo "=== Push Trigger Received - Detecting Changes ==="
              if [ "${{ steps.changes.outputs.backend }}" == "true" ]; then
                echo "-> Backend changes detected."
                SERVICES="$SERVICES backend"
              fi

              if [ "${{ steps.changes.outputs.frontend }}" == "true" ]; then
                echo "-> Frontend changes detected."
                SERVICES="$SERVICES frontend"
              fi

              if [ "${{ steps.changes.outputs.gateway }}" == "true" ]; then
                echo "-> Gateway / Config changes detected."
                SERVICES="$SERVICES gateway"
              fi
            fi

            if [ -z "$SERVICES" ]; then
              echo "-> Rebuilding and restarting ALL services..."
              docker compose build $BUILD_ARGS
              docker compose up -d
            else
              echo "-> Rebuilding and restarting affected services:$SERVICES"
              docker compose build $BUILD_ARGS $SERVICES
              docker compose up -d $SERVICES
            fi

            echo "=== Pruning Docker system and build cache ==="
            docker system prune -af --volumes

            echo "=== Deployment Completed Successfully ==="
