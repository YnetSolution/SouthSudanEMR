name: Deploy Distro to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: 'Service(s) to rebuild & deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'backend'
          - 'frontend'
          - 'gateway'
          - 'backend frontend'
      no_cache:
        description: 'Build without Docker cache (--no-cache)'
        required: true
        type: boolean
        default: false

jobs:
  deploy:
    name: Detect Changes & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed files
        if: github.event_name == 'push'
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'distro/**'
              - 'pom.xml'
              - 'Dockerfile'
              - 'runtime-properties-config'
              - 'update_scheduler.sql'
            frontend:
              - 'frontend/**'
            gateway:
              - 'gateway/**'
              - 'nginx/**'
              - 'docker-compose*.yml'

      - name: Log Detected Changed Files
        if: github.event_name == 'push'
        run: |
          echo "=== Changed Files Detection Summary ==="
          echo "Backend Changed:  ${{ steps.changes.outputs.backend }}"
          echo "Frontend Changed: ${{ steps.changes.outputs.frontend }}"
          echo "Gateway Changed:  ${{ steps.changes.outputs.gateway }}"

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          request_pty: true
          script: |
            set -e
            cd ${{ secrets.SERVER_PROJECT_PATH }}

            echo "::group::1. Pulling latest code from main branch"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git pull origin main
            echo "::endgroup::"

            SERVICES=""
            BUILD_ARGS=""

            if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              echo "::group::2. Processing Manual Workflow Dispatch Trigger"
              SELECTED_SERVICE="${{ github.event.inputs.service }}"
              NO_CACHE="${{ github.event.inputs.no_cache }}"

              if [ "$NO_CACHE" == "true" ]; then
                echo "-> Building WITHOUT Docker cache (--no-cache)"
                BUILD_ARGS="--no-cache"
              fi

              if [ "$SELECTED_SERVICE" != "all" ]; then
                SERVICES="$SELECTED_SERVICE"
              fi
              echo "Target services: ${SERVICES:-all}"
              echo "::endgroup::"
            else
              echo "::group::2. Detecting Changed Services"
              if [ "${{ steps.changes.outputs.backend }}" == "true" ]; then
                echo "-> Backend changes detected."
                SERVICES="$SERVICES backend"
              fi

              if [ "${{ steps.changes.outputs.frontend }}" == "true" ]; then
                echo "-> Frontend changes detected."
                SERVICES="$SERVICES frontend"
              fi

              if [ "${{ steps.changes.outputs.gateway }}" == "true" ]; then
                echo "-> Gateway / Config changes detected."
                SERVICES="$SERVICES gateway"
              fi
              echo "Target services: ${SERVICES:-all}"
              echo "::endgroup::"
            fi

            if [ -z "$SERVICES" ]; then
              echo "::group::3. Building Docker Images (All Services)"
              docker compose build $BUILD_ARGS
              echo "::endgroup::"

              echo "::group::4. Starting Docker Containers (All Services)"
              docker compose up -d
              echo "::endgroup::"
            else
              echo "::group::3. Building Docker Images ($SERVICES)"
              docker compose build $BUILD_ARGS $SERVICES
              echo "::endgroup::"

              echo "::group::4. Starting Docker Containers ($SERVICES)"
              docker compose up -d $SERVICES
              echo "::endgroup::"
            fi

            echo "::group::5. Pruning System & Build Cache"
            docker system prune -af --volumes
            echo "::endgroup::"

            echo "=== Deployment Completed Successfully ==="
