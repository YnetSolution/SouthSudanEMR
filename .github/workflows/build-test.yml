name: Build and Validate Configuration

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPSY_USERNAME: ${{ secrets.REPSY_USERNAME }}
      REPSY_PASSWORD: ${{ secrets.REPSY_PASSWORD }}
    strategy:
        matrix:
          java: [ '8' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
          server-id: repsy
          server-username: REPSY_USERNAME
          server-password: REPSY_PASSWORD

      - name: Build and Test
        run: mvn --batch-mode --update-snapshots --activate-profiles distro,validator clean package
